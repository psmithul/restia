services:
  odysseus:
    # Normal installs pull the public GHCR image. Developers can still run
    # `docker compose up -d --build` to build this checkout locally.
    image: ${RESTIA_IMAGE:-ghcr.io/psmithul/restia:latest}
    build:
      context: .
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-7000}:7000"
    volumes:
      - ${APP_DATA_DIR:-./data}:/app/data:z
      - ${APP_LOGS_DIR:-./logs}:/app/logs:z
      # Optional shared attachment mount. For shared mode, set
      # RESTIA_BLOB_ROOT=/app/blobs and use the same APP_BLOB_DIR on replicas.
      - ${APP_BLOB_DIR:-./data/blobs}:/app/blobs:z
      # Cookbook remote-server SSH identity. Restia can generate a key here;
      # add the shown public key to each remote server's authorized_keys.
      - ${APP_DATA_DIR:-./data}/ssh:/app/.ssh:z
      # Cookbook local model cache. Inside Docker, "Local" means the Restia
      # container, so persist its HuggingFace cache under ./data/huggingface.
      - ${APP_DATA_DIR:-./data}/huggingface:/app/.cache/huggingface:z
      # Cookbook-installed Python CLIs/packages (vLLM, llama-cpp-python, etc.)
      # land under /app/.local for the odysseus user. Persist them so a
      # container recreate does not silently remove installed serve engines.
      - ${APP_DATA_DIR:-./data}/local:/app/.local:z
      # NPX-based MCP packages (for example Playwright MCP) cache here under
      # the non-root app user; persist it so optional browser tooling survives
      # container recreates.
      - ${APP_DATA_DIR:-./data}/npm:/app/.npm:z
    extra_hosts:
      # Lets the container reach local services on the Docker host, including
      # Ollama at http://host.docker.internal:11434.
      - "host.docker.internal:host-gateway"
    environment:
      # Container timezone (IANA name). Server-local timestamps (task digests,
      # fallback user timezone when no browser headers) render in this zone.
      - TZ=${TZ:-}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - REQUEST_HARD_TIMEOUT=${REQUEST_HARD_TIMEOUT:-300}
      - LLM_HOST=${LLM_HOST:-localhost}
      - LLM_HOSTS=${LLM_HOSTS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - RESEARCH_LLM_ENDPOINT=${RESEARCH_LLM_ENDPOINT:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - SEARXNG_INSTANCE=http://searxng:8080
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
      - RESTIA_DATABASE_MODE=${RESTIA_DATABASE_MODE:-local-single}
      - RESTIA_ENCRYPTION_KEY=${RESTIA_ENCRYPTION_KEY:-}
      - RESTIA_ENCRYPTION_KEY_FILE=${RESTIA_ENCRYPTION_KEY_FILE:-}
      - RESTIA_SUPABASE_PROJECT_URL=${RESTIA_SUPABASE_PROJECT_URL:-}
      - RESTIA_SUPABASE_AUDIENCE=${RESTIA_SUPABASE_AUDIENCE:-}
      - RESTIA_BLOB_STORE=${RESTIA_BLOB_STORE:-}
      - RESTIA_BLOB_ROOT=${RESTIA_BLOB_ROOT:-}
      - RESTIA_CONTACTS_IMPORT_OWNER=${RESTIA_CONTACTS_IMPORT_OWNER:-}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - LOCALHOST_BYPASS=${LOCALHOST_BYPASS:-false}
      - ODYSSEUS_ADMIN_USER=${ODYSSEUS_ADMIN_USER:-admin}
      - ODYSSEUS_ADMIN_PASSWORD=${ODYSSEUS_ADMIN_PASSWORD:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - EMBEDDING_URL=${EMBEDDING_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - FASTEMBED_MODEL=${FASTEMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - FASTEMBED_CACHE_PATH=${FASTEMBED_CACHE_PATH:-}
      - CLEANUP_INTERVAL_HOURS=${CLEANUP_INTERVAL_HOURS:-24}
      - RESTIA_INPROCESS_POLLERS=${RESTIA_INPROCESS_POLLERS:-${ODYSSEUS_INPROCESS_POLLERS:-1}}
      - ODYSSEUS_INPROCESS_POLLERS=${ODYSSEUS_INPROCESS_POLLERS:-1}
      - RESTIA_INPROCESS_TASKS=${RESTIA_INPROCESS_TASKS:-${ODYSSEUS_INPROCESS_TASKS:-1}}
      - ODYSSEUS_INPROCESS_TASKS=${ODYSSEUS_INPROCESS_TASKS:-1}
      - RESTIA_INPROCESS_TELEGRAM=${RESTIA_INPROCESS_TELEGRAM:-}
      - ODYSSEUS_INPROCESS_TELEGRAM=${ODYSSEUS_INPROCESS_TELEGRAM:-1}
      - RESTIA_INPROCESS_CONTACT_DELIVERY=${RESTIA_INPROCESS_CONTACT_DELIVERY:-1}
      - RESTIA_CONTACT_DELIVERY_INTERVAL_SECONDS=${RESTIA_CONTACT_DELIVERY_INTERVAL_SECONDS:-}
      - RESTIA_CONTACT_DELIVERY_BATCH_SIZE=${RESTIA_CONTACT_DELIVERY_BATCH_SIZE:-}
      - RESTIA_INPROCESS_CALENDAR_DELIVERY=${RESTIA_INPROCESS_CALENDAR_DELIVERY:-1}
      - RESTIA_CALENDAR_DELIVERY_INTERVAL_SECONDS=${RESTIA_CALENDAR_DELIVERY_INTERVAL_SECONDS:-}
      - RESTIA_CALENDAR_DELIVERY_BATCH_SIZE=${RESTIA_CALENDAR_DELIVERY_BATCH_SIZE:-}
      - CARDDAV_BLOCK_PRIVATE_IPS=${CARDDAV_BLOCK_PRIVATE_IPS:-false}
      - CARDDAV_ALLOW_PUBLIC_HTTP=${CARDDAV_ALLOW_PUBLIC_HTTP:-false}
      - ODYSSEUS_SCRIPT_HOST=${ODYSSEUS_SCRIPT_HOST:-localhost}
      - ODYSSEUS_CHAT_UPLOAD_MAX_BYTES=${ODYSSEUS_CHAT_UPLOAD_MAX_BYTES:-10485760}
      - ODYSSEUS_GALLERY_UPLOAD_MAX_BYTES=${ODYSSEUS_GALLERY_UPLOAD_MAX_BYTES:-104857600}
      - ODYSSEUS_GALLERY_TRANSFORM_UPLOAD_MAX_BYTES=${ODYSSEUS_GALLERY_TRANSFORM_UPLOAD_MAX_BYTES:-26214400}
      - ODYSSEUS_MEMORY_IMPORT_MAX_BYTES=${ODYSSEUS_MEMORY_IMPORT_MAX_BYTES:-10485760}
      - ODYSSEUS_PERSONAL_UPLOAD_MAX_BYTES=${ODYSSEUS_PERSONAL_UPLOAD_MAX_BYTES:-26214400}
      - ODYSSEUS_EMAIL_COMPOSE_UPLOAD_MAX_BYTES=${ODYSSEUS_EMAIL_COMPOSE_UPLOAD_MAX_BYTES:-26214400}
      - ODYSSEUS_PROJECT_ATTACHMENT_MAX_BYTES=${ODYSSEUS_PROJECT_ATTACHMENT_MAX_BYTES:-52428800}
      - RESTIA_PROJECT_UPLOAD_CONCURRENCY=${RESTIA_PROJECT_UPLOAD_CONCURRENCY:-2}
      - RESTIA_PROJECT_UPLOAD_BODY_IDLE_TIMEOUT_SECONDS=${RESTIA_PROJECT_UPLOAD_BODY_IDLE_TIMEOUT_SECONDS:-30}
      - RESTIA_PROJECT_UPLOAD_BODY_TOTAL_TIMEOUT_SECONDS=${RESTIA_PROJECT_UPLOAD_BODY_TOTAL_TIMEOUT_SECONDS:-900}
      - RESTIA_PROJECT_ATTACHMENT_DOWNLOAD_CONCURRENCY=${RESTIA_PROJECT_ATTACHMENT_DOWNLOAD_CONCURRENCY:-8}
      - RESTIA_PROJECT_ATTACHMENT_DOWNLOAD_PER_PRINCIPAL=${RESTIA_PROJECT_ATTACHMENT_DOWNLOAD_PER_PRINCIPAL:-2}
      - RESTIA_PROJECT_STORAGE_MAX_BYTES=${RESTIA_PROJECT_STORAGE_MAX_BYTES:-5368709120}
      - RESTIA_PROJECT_OWNER_STORAGE_MAX_BYTES=${RESTIA_PROJECT_OWNER_STORAGE_MAX_BYTES:-53687091200}
      - RESTIA_PROJECT_GLOBAL_STORAGE_MAX_BYTES=${RESTIA_PROJECT_GLOBAL_STORAGE_MAX_BYTES:-214748364800}
      - RESTIA_PROJECT_MAX_PROJECTS_PER_OWNER=${RESTIA_PROJECT_MAX_PROJECTS_PER_OWNER:-200}
      - RESTIA_PROJECT_MAX_STAGES_PER_PROJECT=${RESTIA_PROJECT_MAX_STAGES_PER_PROJECT:-50}
      - RESTIA_PROJECT_MAX_ACTIVITY_PER_PROJECT=${RESTIA_PROJECT_MAX_ACTIVITY_PER_PROJECT:-20000}
      - RESTIA_PROJECT_MAX_ACTIVE_ITEMS=${RESTIA_PROJECT_MAX_ACTIVE_ITEMS:-2000}
      - RESTIA_PROJECT_MAX_ITEMS=${RESTIA_PROJECT_MAX_ITEMS:-10000}
      - RESTIA_PROJECT_MAX_CHECKLIST_ITEMS_PER_ITEM=${RESTIA_PROJECT_MAX_CHECKLIST_ITEMS_PER_ITEM:-500}
      - RESTIA_PROJECT_MAX_COMMENTS_PER_ITEM=${RESTIA_PROJECT_MAX_COMMENTS_PER_ITEM:-1000}
      - RESTIA_PROJECT_MAX_ATTACHMENTS_PER_ITEM=${RESTIA_PROJECT_MAX_ATTACHMENTS_PER_ITEM:-200}
      - RESTIA_PROJECT_MAX_ATTACHMENTS_PER_PROJECT=${RESTIA_PROJECT_MAX_ATTACHMENTS_PER_PROJECT:-5000}
      - ODYSSEUS_STT_MAX_AUDIO_BYTES=${ODYSSEUS_STT_MAX_AUDIO_BYTES:-26214400}
      - ODYSSEUS_ICS_MAX_BYTES=${ODYSSEUS_ICS_MAX_BYTES:-10485760}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - TELEGRAM_ALLOWED_CHAT_IDS=${TELEGRAM_ALLOWED_CHAT_IDS:-}
      - TELEGRAM_ALLOW_ALL_CHATS=${TELEGRAM_ALLOW_ALL_CHATS:-}
      - TELEGRAM_OWNER=${TELEGRAM_OWNER:-}
      - DATA_BRAVE_API_KEY=${DATA_BRAVE_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_PSE_CX=${GOOGLE_PSE_CX:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - MNEMOSYNE_DATA_DIR=/app/data
      # Home Link between Restia installations. No-colon default on
      # RESTIA_HOME_SERVER is deliberate: set-but-empty in .env must
      # leave fresh installs without a preselected remote contact.
      - RESTIA_HOME_SERVER=${RESTIA_HOME_SERVER-}
      - LINK_HUB_ENABLED=${LINK_HUB_ENABLED:-true}
      - LINK_OWNER=${LINK_OWNER:-}
      - LINK_MAX_PENDING=${LINK_MAX_PENDING:-25}
      - LINK_MAX_GUESTS=${LINK_MAX_GUESTS:-500}
      # PUID / PGID — the user/group the container drops to before
      # running uvicorn (entrypoint also chowns /app/data + /app/logs
      # to match, so bind-mounted files stay editable from the host).
      # 1000 is the default first user on most Linux installs. If your
      # host user has a different id, override here or via .env, e.g.:
      #   PUID=1001
      #   PGID=1001
      # Find yours with:  id -u  /  id -g
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # WebRTC calling. Media is peer-to-peer; the app only relays signaling.
      # STUN-only calling is available by default. A TURN relay is strongly
      # recommended for strict NAT, CGNAT, and corporate networks:
      #   TURN_URL=turn:turn.example.com:3478
      #   TURN_USERNAME=... / TURN_CREDENTIAL=...
      - STUN_URL=${STUN_URL:-stun:stun.l.google.com:19302}
      - TURN_URL=${TURN_URL:-}
      - TURN_USERNAME=${TURN_USERNAME:-}
      - TURN_CREDENTIAL=${TURN_CREDENTIAL:-}
    depends_on:
      searxng:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped

  chromadb:
    image: docker.io/chromadb/chroma:latest
    ports:
      - "${CHROMADB_BIND:-127.0.0.1}:8100:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  searxng:
    # Pinned, not :latest — odysseus waits on searxng's healthcheck
    # (depends_on: condition: service_healthy), so a broken upstream `latest`
    # tag blocks the whole app from starting. 2026.6.2 crashes on boot with
    # `KeyError: 'default_doi_resolver'`, failing the healthcheck (issue #1414).
    # Bump this deliberately after verifying a newer tag boots clean.
    image: docker.io/searxng/searxng:2026.5.31-7159b8aed
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -s /etc/searxng/settings.yml ] || grep -q 'odysseus-local-searxng-json-2026-05-30\|__SEARXNG_SECRET__' /etc/searxng/settings.yml; then
          secret="$${SEARXNG_SECRET:-}"
          if [ -z "$$secret" ]; then
            secret="$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          fi
          sed "s|__SEARXNG_SECRET__|$$secret|g" /tmp/searxng-settings.yml.template > /etc/searxng/settings.yml
        fi
        exec /usr/local/searxng/entrypoint.sh
    ports:
      - "${SEARXNG_BIND:-127.0.0.1}:${SEARXNG_PORT:-8080}:8080"
    volumes:
      - searxng-data:/etc/searxng
      - ./config/searxng/settings.yml:/tmp/searxng-settings.yml.template:ro,z
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    # The official searxng image runs as the non-root `searxng` user, but its
    # entrypoint still needs to chown /etc/searxng on first boot, drop privs via
    # su-exec, and (with our wrapper above) write settings.yml into the named
    # volume. Without these capabilities the wrapper aborts at the redirection
    # with EACCES and the container fails its healthcheck with permission
    # errors during setup. Mirrors the cap set recommended by the upstream
    # searxng-docker compose file. See issue #721.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)\""]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ntfy:
    image: docker.io/binwiederhier/ntfy
    command: serve
    ports:
      - "${NTFY_BIND:-127.0.0.1}:8091:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8091}
    restart: unless-stopped



volumes:
  searxng-data:
  chromadb-data:
  ntfy-cache:
