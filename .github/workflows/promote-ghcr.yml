name: ci / promote GHCR image

# Promote an already-built immutable multi-architecture index to the release
# channel. The digest-only input prevents mutable-tag races and avoids ever
# replacing :latest with a single-architecture developer image.
on:
  workflow_dispatch:
    inputs:
      source_digest:
        description: Immutable Restia OCI index digest (sha256:...)
        required: true
        type: string

permissions: {}

concurrency:
  group: ghcr-promotion
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  promote:
    name: promote immutable index to latest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and promote immutable index
        shell: bash
        env:
          SOURCE_DIGEST: ${{ inputs.source_digest }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          image="${REGISTRY}/${IMAGE_NAME}"
          source="${image}@${SOURCE_DIGEST}"

          docker buildx imagetools inspect --raw "$source" > /tmp/source.json
          jq -e '
            (.mediaType == "application/vnd.oci.image.index.v1+json")
            and (([
              .manifests[]
              | select(.platform.os == "linux")
              | .platform.architecture
            ] | sort) == ["amd64", "arm64"])
          ' /tmp/source.json

          docker buildx imagetools create \
            --tag "${image}:latest" \
            "$source"

          latest_inspect="$(docker buildx imagetools inspect "${image}:latest")"
          actual="$(awk '$1 == "Digest:" {print $2; exit}' <<< "$latest_inspect")"
          test "$actual" = "$SOURCE_DIGEST"
