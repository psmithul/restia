name: ci / docker publish

# Build the Restia image and publish to GHCR.
#   push to main -> :latest                       (curated stable branch)
#   push to dev  -> :dev, :X.Y.Z-dev.<sha>       (rolling dev + immutable pin)
#   release      -> :latest, :X | :X.Y | :X.Y.Z (public precision expresses scope)
# Multi-arch (linux/amd64 + linux/arm64): each arch builds on its own native
# runner and pushes by digest. A candidate index is smoke-tested on both native
# architectures and with shared PostgreSQL before a final job applies tags.
# Registry: ghcr.io/<owner>/<repo>.

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  release:
    types: [published]

concurrency:
  # Main and release events both promote the stable channel; serialize them so
  # an older run cannot race a release and overwrite :latest. Rolling dev runs
  # may still supersede an older in-progress dev build.
  group: docker-publish-${{ github.event_name == 'release' && 'stable' || github.ref == 'refs/heads/main' && 'stable' || github.ref_name }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  preflight:
    name: release version preflight
    runs-on: ubuntu-latest
    outputs:
      canonical_version: ${{ steps.version.outputs.canonical_version }}
      public_version: ${{ steps.version.outputs.public_version }}
      public_tag: ${{ steps.version.outputs.public_tag }}
      image_tag: ${{ steps.version.outputs.image_tag }}
      release_scope: ${{ steps.version.outputs.release_scope }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      build_channel: ${{ steps.version.outputs.build_channel }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Validate canonical version and public release tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          v=$(grep -E '^APP_VERSION' src/constants.py | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          [ -n "$v" ] || { echo "APP_VERSION not found" >&2; exit 1; }

          args=(preflight "$v" --github-output "$GITHUB_OUTPUT")
          if [ "$EVENT_NAME" = "release" ]; then
            args+=(--release-tag "$RELEASE_TAG")
          fi
          python3 -m src.release_version "${args[@]}"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "release" ]; then
            channel=release
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            channel=stable
          else
            channel=dev
          fi
          echo "build_channel=$channel" >> "$GITHUB_OUTPUT"

  postgres-gate:
    name: PostgreSQL migration + shared readiness gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: restia
          POSTGRES_USER: restia
          POSTGRES_PASSWORD: restia-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restia -d restia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install migration-gate dependencies
        run: >-
          pip install SQLAlchemy 'alembic>=1.14,<2'
          'psycopg[binary]>=3.2,<4' cryptography
      - name: Create ephemeral shared-runtime key and blob root
        run: |
          python - <<'PY'
          from pathlib import Path
          from cryptography.fernet import Fernet
          Path("/tmp/restia-ci-fernet-key").write_bytes(Fernet.generate_key())
          PY
          chmod 600 /tmp/restia-ci-fernet-key
          mkdir -p /tmp/restia-ci-blobs
      - name: Run complete PostgreSQL migration and readiness gate
        env:
          DATABASE_URL: postgresql+psycopg://restia:restia-ci-only@127.0.0.1:5432/restia
          RESTIA_DATABASE_MODE: shared
          AUTH_ENABLED: "true"
          LOCALHOST_BYPASS: "false"
          RESTIA_ENCRYPTION_KEY_FILE: /tmp/restia-ci-fernet-key
          RESTIA_BLOB_STORE: shared-filesystem
          RESTIA_BLOB_ROOT: /tmp/restia-ci-blobs
        run: python scripts/odysseus-db shared-gate --migration-smoke --pretty

  build:
    name: build (${{ matrix.arch }})
    needs: [preflight, postgres-gate]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_CHANNEL=${{ needs.preflight.outputs.build_channel }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: assemble candidate index
    runs-on: ubuntu-latest
    needs: [preflight, build]
    outputs:
      image: ${{ steps.inspect.outputs.image }}
      digest: ${{ steps.inspect.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create immutable candidate manifest list
        working-directory: /tmp/digests
        env:
          BUILD_CHANNEL: ${{ needs.preflight.outputs.build_channel }}
        run: |
          set -euo pipefail
          candidate="${REGISTRY}/${IMAGE_NAME}:candidate-${GITHUB_SHA}-${BUILD_CHANNEL}"
          digests=$(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)
          # Word-splitting is intended: $digests expands to the two reviewed
          # architecture manifests exported by the native build jobs.
          # shellcheck disable=SC2086
          docker buildx imagetools create --tag "$candidate" $digests
      - name: Inspect exact candidate platforms and retain immutable digest
        id: inspect
        env:
          BUILD_CHANNEL: ${{ needs.preflight.outputs.build_channel }}
        run: |
          set -euo pipefail
          candidate="${REGISTRY}/${IMAGE_NAME}:candidate-${GITHUB_SHA}-${BUILD_CHANNEL}"
          inspect=$(docker buildx imagetools inspect "$candidate")
          printf '%s\n' "$inspect"
          docker buildx imagetools inspect --raw "$candidate" > /tmp/restia-index.json
          jq -e '
            (.mediaType == "application/vnd.oci.image.index.v1+json"
             or .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json")
            and (([
              .manifests[]
              | select(.platform.os == "linux")
              | .platform.architecture
            ] | sort) == ["amd64", "arm64"])
          ' /tmp/restia-index.json
          digest=$(printf '%s\n' "$inspect" | awk '$1 == "Digest:" {print $2; exit}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}@${digest}" >> "$GITHUB_OUTPUT"

  smoke:
    name: shipped smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [preflight, merge]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke exact shipped runtime
        env:
          IMAGE: ${{ needs.merge.outputs.image }}
          EXPECTED_VERSION: ${{ needs.preflight.outputs.canonical_version }}
          EXPECTED_CHANNEL: ${{ needs.preflight.outputs.build_channel }}
        run: |
          scripts/smoke-release-container.sh \
            "$IMAGE" "$EXPECTED_VERSION" "$GITHUB_SHA" "$EXPECTED_CHANNEL" \
            "${{ matrix.arch }}"

  shared_smoke:
    name: shipped shared PostgreSQL Compose smoke
    runs-on: ubuntu-latest
    needs: [preflight, merge]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Exercise the production shared-PostgreSQL overlay
        env:
          IMAGE: ${{ needs.merge.outputs.image }}
          EXPECTED_VERSION: ${{ needs.preflight.outputs.canonical_version }}
          EXPECTED_CHANNEL: ${{ needs.preflight.outputs.build_channel }}
        run: |
          scripts/smoke-shared-postgres-compose.sh \
            "$IMAGE" "$EXPECTED_VERSION" "$GITHUB_SHA" "$EXPECTED_CHANNEL"

  publish:
    name: promote verified index to release tags
    runs-on: ubuntu-latest
    needs: [preflight, merge, smoke, shared_smoke]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute public tags
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' }}
            type=raw,value=${{ needs.preflight.outputs.image_tag }},enable=${{ github.event_name == 'release' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=${{ needs.preflight.outputs.canonical_version }}-dev.${{ needs.preflight.outputs.short_sha }},enable=${{ github.ref == 'refs/heads/dev' }}
      - name: Promote the exact verified digest and verify every tag
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
          SOURCE_IMAGE: ${{ needs.merge.outputs.image }}
          SOURCE_DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          set -euo pipefail
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$METADATA_JSON")
          # Word-splitting is intended: $tags expands metadata's reviewed list.
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags "$SOURCE_IMAGE"

          while IFS= read -r tag; do
            inspect=$(docker buildx imagetools inspect "$tag")
            actual=$(printf '%s\n' "$inspect" | awk '$1 == "Digest:" {print $2; exit}')
            test "$actual" = "$SOURCE_DIGEST"
          done < <(jq -r '.tags[]' <<< "$METADATA_JSON")
