name: Auto Deploy to VPS

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    name: Deploy to app.restia.dev
    runs-on: ubuntu-latest
    # Wait for the docker-publish job to finish successfully before deploying,
    # in case your server pulls from GHCR instead of building locally.
    # If you build locally on the VPS, you can remove this `needs` line.
    
    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            # Navigate to the deployment directory (defaulting to ~/odysseus if not set)
            cd ${{ secrets.DEPLOY_DIR || '~/odysseus' }}
            
            # Pull the latest changes from the dev branch
            git fetch origin dev
            git reset --hard origin/dev
            
            # Pass the latest commit hash to the docker build so the update checker works
            export BUILD_COMMIT=$(git rev-parse --short HEAD)
            
            # Rebuild and restart the container
            docker-compose up -d --build odysseus
            
            # Prune old dangling images to save disk space
            docker image prune -f
